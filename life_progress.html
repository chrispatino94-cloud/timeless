<!DOCTYPE html>
<html>
<head>
  <title>Life Progress Bar</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 36px;
    }

    label {
      display: block;
      margin-top: 20px;
      color: #ccc;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      width: 100%;
      border-radius: 8px;
      border: none;
    }

    .bar-container {
      margin-top: 25px;
      background: #444;
      border-radius: 20px;
      overflow: hidden;
      height: 45px;
    }

    .bar {
      height: 100%;
      background: #00e640;
      width: 0%;
      transition: width 0.5s ease;
    }

    .result {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Life Progress Bar</h1>

  <label>Birthdate</label>
  <input type="date" id="birthdate">

  <label>Estimated lifespan age</label>
  <input type="number" id="lifespan" value="82">

  <label>Retirement age</label>
  <input type="number" id="retirement" value="67">

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="lifeText">Life: --%</div>
  <div class="bar-container">
    <div class="bar" id="lifeBar"></div>
  </div>

  <div class="result" id="retireText">Working life until retirement: --%</div>
  <div class="bar-container">
    <div class="bar" id="retireBar"></div>
  </div>

  <script>
    function calculate() {
      const birthdate = new Date(document.getElementById("birthdate").value);
      const lifespan = Number(document.getElementById("lifespan").value);
      const retirementAge = Number(document.getElementById("retirement").value);
      const now = new Date();

      if (!birthdate || isNaN(birthdate)) {
        alert("Enter your birthdate first.");
        return;
      }

      const msPerYear = 1000 * 60 * 60 * 24 * 365.25;
      const age = (now - birthdate) / msPerYear;

      const lifePercent = Math.min((age / lifespan) * 100, 100);
      const retirementPercent = Math.min((age / retirementAge) * 100, 100);

      document.getElementById("lifeText").innerText =
        `Life: ${lifePercent.toFixed(2)}% passed`;

      document.getElementById("lifeBar").style.width =
        lifePercent + "%";

      document.getElementById("retireText").innerText =
        `Working life until retirement: ${retirementPercent.toFixed(2)}% passed`;

      document.getElementById("retireBar").style.width =
        retirementPercent + "%";
    }
  </script>

</body>
</html>
